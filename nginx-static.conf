# Optimized Nginx config for static Next.js pSEO sites
# Designed for: oracle-formation monorepo (quelle-formation, deplacement-pro)

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/html
        text/css
        application/javascript
        application/json
        image/svg+xml
        text/plain
        text/xml
        application/xml;

    # --- Security Headers ---
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; frame-ancestors 'none'" always;

    # --- Canonical Link Header ---
    add_header Link "<$scheme://$http_host$uri>; rel=\"canonical\"" always;

    # --- Trailing Slash Removal ---
    # Must come before location blocks to prevent soft 404s on /page/ vs /page
    rewrite ^/(.*)/$ /$1 permanent;

    # --- Cache: Next.js Hashed Static Assets ---
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }

    # --- Cache: Images & Fonts ---
    location ~* \.(jpg|jpeg|png|webp|avif|woff2|ico|svg)$ {
        add_header Cache-Control "public, max-age=604800" always;
        access_log off;
    }

    # --- robots.txt & sitemap.xml ---
    location = /robots.txt {
        log_not_found off;
        access_log off;
    }

    location = /sitemap.xml {
        log_not_found off;
        access_log off;
    }

    # --- Main Location ---
    # CRITICAL for pSEO: do NOT fallback to /index.html (avoids soft 404s)
    location / {
        add_header Cache-Control "public, max-age=0, s-maxage=86400, stale-while-revalidate=3600" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # --- Custom 404 Page ---
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
